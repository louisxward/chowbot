services:
  chowbot:
    container_name: chowbot
    restart: unless-stopped
    build: .
    # Runs a minimal init as PID 1 so SIGTERM reaches node and the bot shuts down cleanly
    init: true
    expose:
      - "33002"
    networks:
      - invenchecker
    env_file:
      - .env
    environment:
      # invenchecker's compose service name on the shared network. localhost would be this
      # container. A value in .env still wins.
      INVENCHECKER_API_URL: ${INVENCHECKER_API_URL:-http://invenchecker:33001}
    volumes:
      - /opt/data/chowbot:/app/data
      - /var/log/chowbot:/app/log
    # Docker's own log of stdout; the app also writes rotated files to /var/log/chowbot
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  invenchecker:
    external: true
